<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#081416">
  <meta name="description" content="光尾蛇 · 双人光轨对决">
  <title>光尾蛇 · Light Trails</title>
  <link rel="icon" href="/light-trails.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <div class="viewport">
  <div id="latency" class="latency" role="status" aria-live="polite" aria-label="网络延迟" hidden></div>
  <main id="game" class="game" aria-label="双人光尾蛇">
    <header class="masthead">
      <div class="brand"><svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M5 5v24h18V17h12"/><path d="M35 35V11H17v12H5"/></svg><h1>光尾蛇<span>LIGHT TRAILS</span></h1></div>
      <span id="connection" class="connection" hidden>连接中断</span>
    </header>
    <div class="arena-wrap">
      <div class="arena">
        <canvas id="board" aria-label="两条彩色光尾蛇在 16:9 赛场内移动" role="img"></canvas>
        <i class="corner top-left" aria-hidden="true"></i><i class="corner top-right" aria-hidden="true"></i><i class="corner bottom-left" aria-hidden="true"></i><i class="corner bottom-right" aria-hidden="true"></i>
        <div class="overlay" id="overlay"><div class="overlay-content">
          <svg class="duel-mark" viewBox="0 0 100 64" fill="none" aria-hidden="true"><path d="M6 8v38h38V28h12"/><path d="M94 56V18H56v18H44"/><rect x="51" y="23" width="10" height="10"/><rect x="39" y="31" width="10" height="10"/></svg>
          <span class="eyebrow" id="eyebrow" hidden>LIGHT TRAILS</span>
          <h2 id="overlay-title">正在连接</h2><p id="overlay-description"></p>
          <button class="replay" id="replay" hidden><span id="replay-label">再来一局</span></button>
          <a id="launch" class="replay" hidden>开始游戏</a>
          <a id="help" class="help-link" href="./help.html" target="_blank" rel="noopener" hidden>操作说明</a>
        </div></div>
      </div>
    </div>
    <div class="match-hud" id="match-hud" aria-label="比分与局数" hidden>
      <section class="player cyan" id="player-1" aria-label="蓝方比分"><span class="player-dot"></span><span class="player-name" id="name-1">蓝方</span><span class="player-role" id="role-1">01</span><strong id="score-1">0</strong></section>
      <div class="arena-meta"><span id="round">第 1 局</span><span id="elapsed">00:00</span></div>
      <section class="player coral" id="player-2" aria-label="橙方比分"><strong id="score-2">0</strong><span class="player-role" id="role-2">02</span><span class="player-name" id="name-2">橙方</span><span class="player-dot"></span></section>
    </div>
    <footer class="bottom"><p id="hint" role="status" aria-live="polite"></p><span class="spectator" id="spectator" hidden>观战</span><span class="rotate-hint">建议横屏游玩</span></footer>
  </main>
  <div class="controls" id="controls" role="group" aria-label="方向键" hidden>
    <button id="up" class="direction direction-up" aria-label="向上" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
    <button id="left" class="direction direction-left" aria-label="向左" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <span class="dpad-center" aria-hidden="true"></span>
    <button id="right" class="direction direction-right" aria-label="向右" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
    <button id="down" class="direction direction-down" aria-label="向下" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 10 6 6 6-6"/></svg></button>
  </div>
  </div>
</body>
</html>
