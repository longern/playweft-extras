<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1019"><title>怎么玩 · 光尾蛇</title><style>body{font:16px/1.9 system-ui,sans-serif;max-width:560px;padding:32px 24px;margin:auto;background:#0c1019;color:#edf2fa}h1{font-size:28px}li{margin:16px 0}p{color:#a9b4c7}strong{color:#63dfef}</style><h1>左右转向，活到最后。</h1><ol><li>光尾蛇会一直向前走。按<strong>左转 / 右转</strong>，相对当前朝向转 90°。</li><li>别撞墙，也别撞任何尾迹，包括自己的。</li><li>对方先撞，你就赢。同时撞则平局。</li><li>每局结束后，两人都点「再来一局」继续对决。</li></ol><p>电脑：← / → 或 A / D。手机：点屏幕下方的两个按钮。每前进一格最多转一次，连续猛点不会掉头。</p><p>短暂掉线时暂停，双方恢复连接后倒数继续。退出游戏请用平台菜单；观众可以看比赛，不能控制光尾蛇。</p></html>
